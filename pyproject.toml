[project]
name = "opendot"
version = "0.1.0"
description = "A self-hosted assistant that takes ongoing work, runs each step in a locked-down container, and asks before it acts."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "croniter>=2.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "mcp>=2.2,<3",
    "tzdata>=2024.1",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/defog-ai/opendot"
Issues = "https://github.com/defog-ai/opendot/issues"

[project.scripts]
opendot = "opendot.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendot"]

[tool.hatch.build.targets.wheel.force-include]
"docker/Dockerfile" = "opendot/Dockerfile"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
